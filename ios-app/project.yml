# Описание Xcode-проекта для XcodeGen. Сам Trenazher.xcodeproj генерируется командой:
#   cd ios-app && xcodegen generate
# Руками .xcodeproj не правим — правим этот файл и генерируем заново.
name: Trenazher
options:
  bundleIdPrefix: com.barsky
  deploymentTarget:
    iOS: "14.0"
  developmentLanguage: ru
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  TrenazherKit:
    path: TrenazherKit
targets:
  Trenazher:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "*.entitlements"
    dependencies:
      - package: TrenazherKit
        product: TrenazherKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Тренажёр
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: ru
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # Значения подставляются из Config/App.xcconfig и Config/Secrets.xcconfig.
        GoogleAPIKey: $(GOOGLE_API_KEY)
        GoogleSpreadsheetID: $(GOOGLE_SPREADSHEET_ID)
        GoogleDriveFolderID: $(GOOGLE_DRIVE_FOLDER_ID)
        CloudKitContainerID: $(CLOUDKIT_CONTAINER_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
schemes:
  Trenazher:
    build:
      targets:
        Trenazher: all
    run:
      config: Debug
    archive:
      config: Release
